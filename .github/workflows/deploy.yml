name: Deploy ERP to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        id: deploy_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: &deploy_script |
            set -e

            exec 9>/tmp/sinagukit-deploy.lock
            if ! flock -n 9; then
              echo "Another deploy is already in progress on this server. Exiting."
              exit 1
            fi

            cd /var/www/my-app

            PREV_SHA=$(git rev-parse HEAD)

            attempt_deploy() {
              (
                set -e
                npm ci
                npm run build
                pm2 reload sinagukit-bms || pm2 restart sinagukit-bms
                for i in $(seq 1 45); do
                  if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
                    exit 0
                  fi
                  sleep 2
                done
                exit 1
              )
            }

            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)

            echo "Installing dependencies and building ($NEW_SHA)..."
            if attempt_deploy; then
              echo "Deployment completed successfully! App is responding."
              exit 0
            fi

            if [ "$NEW_SHA" = "$PREV_SHA" ]; then
              echo "CRITICAL: app did not come up healthy and there is no earlier commit to roll back to. Check 'pm2 logs sinagukit-bms'."
              exit 1
            fi

            echo "New build ($NEW_SHA) did not come up healthy. Rolling back to $PREV_SHA..."
            git reset --hard "$PREV_SHA"

            if attempt_deploy; then
              echo "Rollback to $PREV_SHA succeeded and app is responding. Failing this deploy since $NEW_SHA was unhealthy."
              exit 1
            fi

            echo "CRITICAL: rollback to $PREV_SHA also failed to come up healthy. Manual intervention required -- check 'pm2 logs sinagukit-bms'."
            exit 1

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: |
          echo "First deploy attempt failed (often a transient SSH connection issue). Retrying in 15s..."
          sleep 15

      - name: Retry deploy to VPS
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: *deploy_script
