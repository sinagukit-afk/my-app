name: Deploy ERP to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            exec 9>/tmp/sinagukit-deploy.lock
            if ! flock -n 9; then
              echo "Another deploy is already in progress on this server. Exiting."
              exit 1
            fi

            cd /var/www/my-app

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Build succeeded. Reloading PM2..."
            pm2 reload sinagukit-bms || pm2 restart sinagukit-bms

            echo "Waiting for app to come back up..."
            for i in $(seq 1 15); do
              if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
                echo "Deployment completed successfully! App is responding."
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: app did not come up healthy after restart. Check 'pm2 logs sinagukit-bms' on the server."
            exit 1